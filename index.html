<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Estetik</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #ffd6e0;
      --bg-2: #c9d6ff;
      --bg-3: #e2c9ff;
      --glass: rgba(255, 255, 255, 0.28);
      --glass-border: rgba(255, 255, 255, 0.55);
      --text: #3a3355;
      --text-soft: #7a7397;
      --key: rgba(255, 255, 255, 0.55);
      --key-hover: rgba(255, 255, 255, 0.8);
      --op: linear-gradient(135deg, #b8a4ff, #d9a7ff);
      --fn: rgba(255, 214, 224, 0.75);
      --equal: linear-gradient(135deg, #ff9a9e, #fad0c4);
      --shadow: 0 20px 50px rgba(90, 70, 150, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: "Poppins", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-1), var(--bg-3), var(--bg-2));
      background-size: 300% 300%;
      animation: gradientShift 14s ease infinite;
      overflow: hidden;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Bola-bola dekoratif di latar belakang */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.6;
      z-index: 0;
      animation: float 10s ease-in-out infinite;
    }

    .blob.one   { width: 260px; height: 260px; background: #ffb3c6; top: 8%;  left: 12%; }
    .blob.two   { width: 320px; height: 320px; background: #b5c7ff; bottom: 6%; right: 10%; animation-delay: -3s; }
    .blob.three { width: 180px; height: 180px; background: #d7b8ff; top: 55%; left: 30%; animation-delay: -6s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(20px, -30px); }
    }

    .calculator {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 340px;
      padding: 28px 22px 24px;
      border-radius: 32px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: var(--shadow);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding: 0 6px;
    }

    .header .title {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-soft);
    }

    .dots {
      display: flex;
      gap: 6px;
    }

    .dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dots span:nth-child(1) { background: #ff9a9e; }
    .dots span:nth-child(2) { background: #ffd6a5; }
    .dots span:nth-child(3) { background: #b8e0d2; }

    .display {
      text-align: right;
      padding: 22px 18px;
      margin-bottom: 22px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.45);
      box-shadow: inset 0 2px 10px rgba(90, 70, 150, 0.08);
      overflow: hidden;
    }

    .display .history {
      font-size: 0.95rem;
      font-weight: 300;
      color: var(--text-soft);
      min-height: 1.4em;
      white-space: nowrap;
    }

    .display .result {
      font-size: 2.6rem;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .key {
      aspect-ratio: 1 / 1;
      border: none;
      border-radius: 20px;
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--text);
      background: var(--key);
      box-shadow: 0 6px 14px rgba(90, 70, 150, 0.12),
                  inset 0 1px 0 rgba(255, 255, 255, 0.8);
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .key:hover {
      background: var(--key-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(90, 70, 150, 0.18),
                  inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .key:active {
      transform: translateY(1px) scale(0.96);
      box-shadow: 0 3px 8px rgba(90, 70, 150, 0.15);
    }

    .key:focus-visible {
      outline: 2px solid #9b87f5;
      outline-offset: 2px;
    }

    .key.fn {
      background: var(--fn);
      color: #c0506e;
    }

    .key.op {
      background: var(--op);
      color: #fff;
      font-size: 1.45rem;
    }

    .key.equal {
      background: var(--equal);
      color: #fff;
      font-size: 1.5rem;
    }

    .key.zero {
      grid-column: span 2;
      aspect-ratio: auto;
      text-align: left;
      padding-left: 28px;
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-soft);
      letter-spacing: 1px;
    }

    @media (max-width: 380px) {
      .calculator { padding: 22px 16px 20px; border-radius: 26px; }
      .keys { gap: 10px; }
      .key { font-size: 1.1rem; border-radius: 16px; }
      .display .result { font-size: 2.1rem; }
    }
  </style>
</head>
<body>
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>

  <main class="calculator">
    <div class="header">
      <div class="dots"><span></span><span></span><span></span></div>
      <span class="title">Calc</span>
    </div>

    <div class="display">
      <div class="history">128 × 4 +</div>
      <div class="result">512</div>
    </div>

    <div class="keys">
      <button class="key fn">AC</button>
      <button class="key fn">±</button>
      <button class="key fn">%</button>
      <button class="key op">÷</button>

      <button class="key">7</button>
      <button class="key">8</button>
      <button class="key">9</button>
      <button class="key op">×</button>

      <button class="key">4</button>
      <button class="key">5</button>
      <button class="key">6</button>
      <button class="key op">−</button>

      <button class="key">1</button>
      <button class="key">2</button>
      <button class="key">3</button>
      <button class="key op">+</button>

      <button class="key zero">0</button>
      <button class="key">,</button>
      <button class="key equal">=</button>
    </div>

    <p class="footer">✿ made with love ✿</p>
  </main>
</body>
</html>
